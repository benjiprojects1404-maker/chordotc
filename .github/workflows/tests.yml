name: Contract tests

# Runs the Foundry fuzz and invariant tests on every pull request and on main.
# A red cross on the PR means a test failed: don't merge until it's green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry:
    name: Foundry tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test # fork tests skip themselves without --fork-url

  arc-fork:
    # Runs the fork tests against a local copy of Arc mainnet (real USDC and EURC; nothing is sent to Arc).
    name: Arc mainnet fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --match-path 'test/foundry/*.fork.t.sol' --fork-url https://rpc.mainnet.arc.io -vv
