[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100
fail_on_revert = false
show_metrics = true

[profile.ci.invariant]
runs = 1000
depth = 200
